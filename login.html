<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Portal Guru SMK Jetis</title>
    
    <!-- Panggil CSS Terpusat -->
    <link rel="stylesheet" href="style/style.css">
    
    <!-- Firebase SDK CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- Panggil JS Auth Terpusat -->
    <script src="auth/auth.js"></script>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="login-wrapper">
        <div class="glass-card login-card">
            <div style="text-align: center; margin-bottom: 20px;">
                <span class="badge-school">SMK NEGERI 1 JETIS</span>
                <h2 style="margin: 10px 0 0 0;">Admin Portal</h2>
                <p class="subtitle" style="font-size: 13px; margin-top: 4px;">Silakan masuk untuk mengakses panel</p>
            </div>

            <form id="loginForm">
                <input type="email" id="emailInput" placeholder="Email Admin" required autocomplete="email">
                <input type="password" id="passwordInput" placeholder="Password" required autocomplete="current-password">
                <button type="submit" style="width: 100%; margin-top: 8px;">Masuk ke Panel</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;

            auth.signInWithEmailAndPassword(email, password)
                .then(() => { 
                    window.location.href = "index.html"; 
                })
                .catch(err => { 
                    alert("Login gagal: " + err.message); 
                });
        });
    </script>
</body>
</html>
